[package]
name = "impression-eyes-reborn"
version = "1.5.0"
edition = "2021"
description = "A tiny, frameless image overlay viewer for Windows"
license = "MIT OR Apache-2.0"
repository = "https://github.com/"

[[bin]]
name = "ime-reborn"
path = "src/main.rs"

[[bin]]
name = "ime-reborn-updater"
path = "src/bin/ime-reborn-updater.rs"

[dependencies]
image = { version = "=0.24.9", default-features = false, features = ["bmp", "dds", "farbfeld", "gif", "ico", "jpeg", "jpeg_rayon", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
libavif = { version = "0.14", default-features = false, features = ["codec-aom"] }
libaom-sys = { version = "0.17", default-features = false, features = ["av1_decoder"] }
jxl-oxide = { version = "0.12.6", features = ["moxcms"] }
semver = "1.0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ureq = "2.12"
windows = { version = "0.58.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
png = "0.17.16"

[profile.release]
lto = true
codegen-units = 1
# Image decoding, resampling, and alpha compositing are hot loops. Optimizing
# for speed is substantially more valuable here than saving a little EXE size.
opt-level = 3
panic = "abort"
strip = true
