name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Windows x86_64 release
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy rustfmt

      - name: Install Windows resource compiler
        shell: pwsh
        run: |
          choco install mingw --yes --no-progress
          choco install nsis --yes --no-progress

      - name: Verify source
        shell: pwsh
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      - name: Build optimized executable
        shell: pwsh
        env:
          CARGO_BUILD_JOBS: 4
        run: cargo build --release --locked

      - name: Package release
        id: package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "manual-${{ github.run_number }}"
          }

          $archiveName = "ime-reborn-windows-x86_64"
          $stage = Join-Path "dist" $archiveName
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -LiteralPath "target\release\ime-reborn.exe" -Destination $stage
          Copy-Item -LiteralPath "README.md" -Destination $stage
          Copy-Item -LiteralPath "assets\ime-reborn-logo.png" -Destination $stage

          $zip = Join-Path "dist" "$archiveName.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -CompressionLevel Optimal

          $checksum = Join-Path "dist" "SHA256SUMS.txt"
          $files = @("target\release\ime-reborn.exe", $zip)
          foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
            $name = Split-Path -Leaf $file
            "$hash  $name" | Add-Content -LiteralPath $checksum
          }

          "zip=$zip" >> $env:GITHUB_OUTPUT
          "exe=target\release\ime-reborn.exe" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT

      - name: Build installed edition
        id: installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ([string]::IsNullOrWhiteSpace($version) -or $version -notmatch '^\d+\.\d+\.\d+$') {
            $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
            $version = $metadata.packages[0].version
          }

          $compiler = @(
            "C:\Program Files (x86)\NSIS\makensis.exe",
            "C:\Program Files\NSIS\makensis.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $compiler) { throw "makensis.exe was not installed" }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $compiler /V2 "/DVERSION=$version" "/DVIEWER_EXE=$PWD\target\release\ime-reborn.exe" "/DUPDATER_EXE=$PWD\target\release\ime-reborn-updater.exe" installer\ime-reborn.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS compilation failed with exit code $LASTEXITCODE" }

          $setup = "dist\ime-reborn-v$version-windows-x86_64-setup.exe"
          if (-not (Test-Path -LiteralPath $setup)) { throw "NSIS output was not created" }
          $stableSetup = "dist\ime-reborn-windows-x86_64-setup.exe"
          Copy-Item -LiteralPath $setup -Destination $stableSetup
          $stableHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $stableSetup).Hash.ToLowerInvariant()
          "$stableHash  $(Split-Path -Leaf $stableSetup)" | Add-Content -LiteralPath "dist\SHA256SUMS.txt"
          "stable_setup=$stableSetup" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "sha256=$stableHash" >> $env:GITHUB_OUTPUT

      - name: Generate updater manifest
        id: update_manifest
        shell: pwsh
        run: |
          $version = "${{ steps.installer.outputs.version }}"
          $tag = "v$version"
          $manifest = [ordered]@{
            schema = 1
            version = $version
            published = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            minimum_updater = "0.1.0"
            installer_url = "https://github.com/taskinoz/Impression-Eyes-Reborn/releases/download/$tag/ime-reborn-windows-x86_64-setup.exe"
            installer_sha256 = "${{ steps.installer.outputs.sha256 }}"
            notes_url = "https://github.com/taskinoz/Impression-Eyes-Reborn/releases/tag/$tag"
          }
          $path = "dist\ime-reborn-update.json"
          $manifest | ConvertTo-Json | Set-Content -LiteralPath $path -Encoding utf8NoBOM
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Build Microsoft Store package
        if: vars.MSIX_IDENTITY_NAME != '' && vars.MSIX_PUBLISHER != '' && vars.MSIX_PUBLISHER_DISPLAY_NAME != ''
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ([string]::IsNullOrWhiteSpace($version) -or $version -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') {
            $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
            $version = $metadata.packages[0].version
          }
          .\packaging\msix\build-msix.ps1 `
            -IdentityName $env:MSIX_IDENTITY_NAME `
            -Publisher $env:MSIX_PUBLISHER `
            -PublisherDisplayName $env:MSIX_PUBLISHER_DISPLAY_NAME `
            -Version $version

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ime-reborn-${{ github.ref_name }}-windows-x86_64
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.exe }}
            ${{ steps.installer.outputs.stable_setup }}
            ${{ steps.update_manifest.outputs.path }}
            ${{ steps.package.outputs.checksum }}
            dist/*.msix
            dist/*.msixupload
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = @(
            "${{ steps.package.outputs.zip }}",
            "${{ steps.package.outputs.exe }}",
            "${{ steps.installer.outputs.stable_setup }}",
            "${{ steps.update_manifest.outputs.path }}",
            "${{ steps.package.outputs.checksum }}"
          )
          $assets += Get-ChildItem -Path "dist\*.msix", "dist\*.msixupload" -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            $version = "${{ steps.installer.outputs.version }}"
            $duplicates = @(
              "ime-reborn-$tag-windows-x86_64.zip",
              "ime-reborn-v$version-windows-x86_64-setup.exe"
            )
            foreach ($duplicate in $duplicates) {
              gh release delete-asset $tag $duplicate --yes 2>$null
            }
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --title "ime-reborn $tag" --generate-notes --verify-tag
          }
